# Runs the service against a SoftHSM2 token inside the container.
#
#   mkdir -p secrets && openssl rand -hex 16 > secrets/user_pin.txt && openssl rand -hex 16 > secrets/so_pin.txt
#   docker compose up --build
#   docker compose --profile bench run --rm bench
services:
  hsm-signer:
    build: .
    image: arkion/hsm-signer:local
    ports:
      - "8080:8080"
    environment:
      HSM_TOKEN_LABEL: arkion
      HSM_SESSIONS: "8"
      HSM_ACQUIRE_TIMEOUT: 2s
      HSM_OP_TIMEOUT: 5s
      HSM_USER_PIN_FILE: /run/secrets/hsm_user_pin
      HSM_SO_PIN_FILE: /run/secrets/hsm_so_pin
      LOG_FORMAT: json
      RUST_LOG: info
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    secrets:
      - hsm_user_pin
      - hsm_so_pin
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  bench:
    image: arkion/hsm-signer:local
    profiles: ["bench"]
    entrypoint: ["hsm-bench"]
    command: ["--url", "http://hsm-signer:8080", "--duration", "10s", "--warmup", "2s"]
    depends_on:
      hsm-signer:
        condition: service_healthy

secrets:
  hsm_user_pin:
    file: ./secrets/user_pin.txt
  hsm_so_pin:
    file: ./secrets/so_pin.txt

volumes:
  softhsm-tokens:
